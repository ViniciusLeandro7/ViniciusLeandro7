<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Royale Arena Daylight Marble) -->
    <linearGradient id="crBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#edf2f7" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Royale Gold Gradients -->
    <linearGradient id="crGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="crGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Elixir Purple Gradient -->
    <linearGradient id="elixirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="40%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Card Rarity Gradients -->
    <linearGradient id="legendaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#9333ea" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="championGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="epicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <linearGradient id="rareGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <linearGradient id="commonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Daylight Stone Tower Gradients -->
    <linearGradient id="towerStoneLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="towerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="crVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Drop Shadow Filter for Light Mode -->
    <filter id="lightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>

    <style>
      .clash-font-xl {
        font-family: 'Supercell-Magic', 'Impact', 'Arial Black', -apple-system, sans-serif;
        text-shadow: 2px 2px 0px #78350f, -1px -1px 0px #78350f, 1px -1px 0px #78350f, -1px 1px 0px #78350f;
      }
      .clash-font-md {
        font-family: 'Supercell-Magic', 'Impact', 'Arial Black', -apple-system, sans-serif;
      }
      .clash-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono-val {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Outer Marble Frame -->
  <rect x="6" y="6" width="888" height="358" rx="22" fill="url(#crBgLight)" stroke="url(#crGoldDark)" stroke-width="4" filter="url(#lightShadow)" />
  <rect x="15" y="15" width="870" height="340" rx="16" fill="none" stroke="url(#crGoldLight)" stroke-width="2" opacity="0.9" />

  <!-- Corner Golden Rivets / Studs -->
  <circle cx="26" cy="26" r="6" fill="#f59e0b" stroke="#78350F" stroke-width="1.5" />
  <circle cx="874" cy="26" r="6" fill="#f59e0b" stroke="#78350F" stroke-width="1.5" />
  <circle cx="26" cy="344" r="6" fill="#f59e0b" stroke="#78350F" stroke-width="1.5" />
  <circle cx="874" cy="344" r="6" fill="#f59e0b" stroke="#78350F" stroke-width="1.5" />

  <!-- =================================================== -->
  <!-- A TORRE DO REI (KING TOWER) - VERSÃO DIURNA         -->
  <!-- =================================================== -->
  <g transform="translate(42, 28) scale(0.85)" filter="url(#lightShadow)">
    <polygon points="26,75 114,75 125,185 15,185" fill="url(#towerStoneLight)" stroke="#475569" stroke-width="2.5" />
    
    <!-- Linhas de tijolos da torre -->
    <path d="M 32 105 L 108 105 M 36 135 L 104 135 M 28 165 L 112 165" stroke="#94a3b8" stroke-width="1.8" />
    <path d="M 68 75 L 68 105 M 52 105 L 52 135 M 88 105 L 88 135 M 70 135 L 70 165" stroke="#94a3b8" stroke-width="1.8" />

    <!-- Estandarte Azul Real -->
    <path d="M 42 90 L 98 90 L 98 160 L 70 178 L 42 160 Z" fill="url(#towerBlue)" stroke="#b45309" stroke-width="2" />
    
    <!-- Brasão Real no Estandarte -->
    <circle cx="70" cy="125" r="14" fill="#1e3a8a" stroke="#f59e0b" stroke-width="1.8" />
    <polygon points="62,129 65,121 70,125 75,121 78,129" fill="#f59e0b" stroke="#78350F" stroke-width="0.8" />
    <circle cx="70" cy="123" r="1.8" fill="#ef4444" />

    <!-- Janela de Observação do Rei -->
    <path d="M 58 92 C 58 82, 82 82, 82 92 L 82 96 L 58 96 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

    <!-- Plataforma da Fortaleza -->
    <polygon points="18,75 122,75 128,60 12,60" fill="#64748b" stroke="#334155" stroke-width="2.5" />
    <rect x="15" y="62" width="110" height="3" fill="#f59e0b" />

    <!-- Ameias de Pedra -->
    <rect x="15" y="42" width="20" height="20" rx="2" fill="url(#towerStoneLight)" stroke="#475569" stroke-width="2" />
    <rect x="44" y="42" width="22" height="20" rx="2" fill="url(#towerStoneLight)" stroke="#475569" stroke-width="2" />
    <rect x="74" y="42" width="22" height="20" rx="2" fill="url(#towerStoneLight)" stroke="#475569" stroke-width="2" />
    <rect x="105" y="42" width="20" height="20" rx="2" fill="url(#towerStoneLight)" stroke="#475569" stroke-width="2" />

    <!-- COROA DO CLASH NO TOPO DA TORRE -->
    <g transform="translate(35, 6) scale(0.5)">
      <path d="M 28 85 C 25 55, 55 35, 80 35 C 105 35, 135 55, 132 85 Z" fill="url(#crVelvet)" stroke="#450A0A" stroke-width="2.5" />
      <path d="M 20 90 L 15 45 L 48 65 L 80 20 L 112 65 L 145 45 L 140 90 Z" fill="#b45309" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
      <path d="M 22 88 L 18 48 L 48 67 L 80 25 L 112 67 L 142 48 L 138 88 Z" fill="#fde047" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="80" cy="22" r="10" fill="#f59e0b" stroke="#78350F" stroke-width="2" />
      <circle cx="80" cy="22" r="6" fill="#ef4444" stroke="#450A0A" stroke-width="1" />
      <circle cx="17" cy="46" r="7.5" fill="#f59e0b" stroke="#78350F" stroke-width="2" />
      <circle cx="143" cy="46" r="7.5" fill="#f59e0b" stroke="#78350F" stroke-width="2" />
      <path d="M 18 86 Q 80 96 142 86 L 144 105 Q 80 118 16 105 Z" fill="#f59e0b" stroke="#78350F" stroke-width="2" />
      <ellipse cx="80" cy="102" rx="9" ry="7" fill="#ef4444" stroke="#450A0A" stroke-width="1.5" />
    </g>
  </g>

  <!-- =================================================== -->
  <!-- TÍTULO PRINCIPAL E INFORMAÇÕES (ALTO CONTRASTE)    -->
  <!-- =================================================== -->
  <g transform="translate(185, 42)">
    <!-- Insígnia Estrela Nível 15 -->
    <g transform="translate(0, 8)">
      <polygon points="20,0 26,13 40,15 29,25 32,38 20,31 8,38 11,25 0,15 14,13" fill="#f59e0b" stroke="#78350F" stroke-width="2" />
      <text x="20" y="26" class="clash-font-md" font-size="14" font-weight="900" fill="#000" text-anchor="middle">15</text>
    </g>

    <!-- Nome do Jogador (Contraste Perfeito no Tema Claro) -->
    <text x="52" y="38" class="clash-font-xl" font-size="40" font-weight="900" fill="#92400e" letter-spacing="1.2">
      VINÍCIUS LEANDRO
    </text>

    <!-- Sub-banner com Detalhes da Torre e Bio -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="670" height="34" rx="17" fill="#1e293b" stroke="#b45309" stroke-width="1.2" />
      <text x="335" y="23" class="clash-sub" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
        👑 TORRE DO REI NÍVEL 15 • ⚔️ #ViniciusLeandro7 • 🏆 9.000+ TROFÉUS
      </text>
    </g>

    <!-- Barra de Elixir e Status do Deck -->
    <g transform="translate(0, 106)">
      <path d="M 14 3 C 14 3, 3 16, 3 22 C 3 28, 8 33, 14 33 C 20 33, 25 28, 25 22 C 25 16, 14 3, 14 3 Z" fill="url(#elixirGrad)" stroke="#4a044e" stroke-width="1.5" />
      <circle cx="10" cy="20" r="3" fill="#fff" opacity="0.7" />
      
      <text x="34" y="24" class="clash-font-md" font-size="14" font-weight="bold" fill="#be185d">DECK PRINCIPAL</text>
      <text x="175" y="24" class="mono-val" font-size="13" font-weight="bold" fill="#334155">• CUSTO MÉDIO DE ELIXIR: 3.4 💧</text>
      <text x="470" y="24" class="clash-sub" font-size="12" font-weight="bold" fill="#b45309">★ LIGA MAIOR CAMPEÃO</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- 5 CARTAS DE BATALHA COM FUNDO BRANCO ELEVADO        -->
  <!-- =================================================== -->
  <!-- CARTA 1: TypeScript (Lendária) -->
  <g transform="translate(38, 218)" filter="url(#lightShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#ffffff" stroke="url(#legendaryGrad)" stroke-width="3" />
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">3</text>
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#0284c7" text-anchor="middle">TypeScript</text>
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">⭐ LENDÁRIA</text>
  </g>

  <!-- CARTA 2: React.js (Campeão) -->
  <g transform="translate(206, 218)" filter="url(#lightShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#ffffff" stroke="url(#championGrad)" stroke-width="3" />
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#2563eb" text-anchor="middle">React.js</text>
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">👑 CAMPEÃO</text>
  </g>

  <!-- CARTA 3: Node.js (Épica) -->
  <g transform="translate(374, 218)" filter="url(#lightShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#ffffff" stroke="url(#epicGrad)" stroke-width="3" />
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#16a34a" text-anchor="middle">Node.js</text>
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#9333ea" text-anchor="middle">💜 ÉPICA</text>
  </g>

  <!-- CARTA 4: Python (Rara) -->
  <g transform="translate(542, 218)" filter="url(#lightShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#ffffff" stroke="url(#rareGrad)" stroke-width="3" />
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#0284c7" text-anchor="middle">Python</text>
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#ea580c" text-anchor="middle">🧡 RARA</text>
  </g>

  <!-- CARTA 5: Docker (Comum) -->
  <g transform="translate(710, 218)" filter="url(#lightShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#ffffff" stroke="url(#commonGrad)" stroke-width="3" />
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">2</text>
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#0284c7" text-anchor="middle">Docker</text>
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">⚪ COMUM</text>
  </g>
</svg>
