<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="60" fill="none">
  <defs>
    <!-- High-Contrast Gold Gradient for both Light and Dark backgrounds -->
    <linearGradient id="divGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" stop-opacity="0" />
      <stop offset="15%" stop-color="#b45309" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="1" />
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="1" />
      <stop offset="85%" stop-color="#b45309" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#92400e" stop-opacity="0" />
    </linearGradient>

    <!-- Ruby Red -->
    <linearGradient id="divRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="divCrownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Universal Drop Shadow (visible on light mode and dark mode) -->
    <filter id="divShadow" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#divShadow)">
    <!-- Left Golden Spear/Line with rich amber base -->
    <line x1="50" y1="30" x2="450" y2="30" stroke="url(#divGoldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="450" cy="30" r="4.5" fill="#FDE047" stroke="#78350f" stroke-width="1.2" />

    <!-- Right Golden Spear/Line with rich amber base -->
    <line x1="550" y1="30" x2="950" y2="30" stroke="url(#divGoldGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="550" cy="30" r="4.5" fill="#FDE047" stroke="#78350f" stroke-width="1.2" />

    <!-- Center Clash Crown Emblem -->
    <g transform="translate(477, 6) scale(0.32)">
      <!-- Red Velvet Cushion -->
      <path d="M 28 85 C 25 55, 55 35, 80 35 C 105 35, 135 55, 132 85 Z" fill="url(#divRuby)" stroke="#450A0A" stroke-width="2.5" />
      <!-- Crown Points -->
      <path d="M 20 90 L 15 45 L 48 65 L 80 20 L 112 65 L 145 45 L 140 90 Z" fill="url(#divCrownGold)" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
      <!-- Center Orb -->
      <circle cx="80" cy="22" r="9" fill="url(#divCrownGold)" stroke="#78350F" stroke-width="2" />
      <circle cx="80" cy="22" r="5" fill="url(#divRuby)" stroke="#450A0A" stroke-width="1" />
      <!-- Peak Jewels -->
      <circle cx="17" cy="46" r="6" fill="url(#divCrownGold)" stroke="#78350F" stroke-width="1.5" />
      <circle cx="143" cy="46" r="6" fill="url(#divCrownGold)" stroke="#78350F" stroke-width="1.5" />
      <!-- Base band -->
      <path d="M 18 86 Q 80 96 142 86 L 144 105 Q 80 118 16 105 Z" fill="url(#divCrownGold)" stroke="#451A03" stroke-width="2.5" />
      <ellipse cx="80" cy="102" rx="8" ry="6" fill="url(#divRuby)" stroke="#450A0A" stroke-width="1" />
    </g>
  </g>
</svg>
