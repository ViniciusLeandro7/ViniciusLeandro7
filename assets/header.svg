<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Royale Arena Night Stone) -->
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16" />
      <stop offset="50%" stop-color="#101d36" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Royale Gold Gradients -->
    <linearGradient id="crGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="crGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Elixir Purple Gradient -->
    <linearGradient id="elixirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Card Rarity Gradients -->
    <linearGradient id="legendaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="championGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="epicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <linearGradient id="rareGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="commonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Stone Tower Gradients -->
    <linearGradient id="towerStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="towerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Velvet & Ruby -->
    <linearGradient id="crVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="crRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bigShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.65" />
    </filter>

    <style>
      .clash-font-xl {
        font-family: 'Supercell-Magic', 'Impact', 'Arial Black', -apple-system, sans-serif;
        text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
      }
      .clash-font-md {
        font-family: 'Supercell-Magic', 'Impact', 'Arial Black', -apple-system, sans-serif;
        text-shadow: 2px 2px 0px #000;
      }
      .clash-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono-val {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .sparkle-star {
        animation: sparkle 2.2s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Outer Stone Container Frame -->
  <rect x="6" y="6" width="888" height="358" rx="22" fill="url(#crBg)" stroke="url(#crGoldDark)" stroke-width="4.5" filter="url(#bigShadow)" />
  <rect x="15" y="15" width="870" height="340" rx="16" fill="none" stroke="url(#crGoldLight)" stroke-width="2" opacity="0.85" />

  <!-- Corner Golden Rivets / Studs -->
  <circle cx="26" cy="26" r="6" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="1.5" />
  <circle cx="874" cy="26" r="6" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="1.5" />
  <circle cx="26" cy="344" r="6" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="1.5" />
  <circle cx="874" cy="344" r="6" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="1.5" />

  <!-- =================================================== -->
  <!-- A TORRE DO REI (KING TOWER) INTEGRADA NO BANNER     -->
  <!-- =================================================== -->
  <g transform="translate(42, 28) scale(0.85)" filter="url(#bigShadow)">
    <!-- Base da Torre de Pedra -->
    <polygon points="26,75 114,75 125,185 15,185" fill="url(#towerStone)" stroke="#090d16" stroke-width="2.5" />
    
    <!-- Linhas de tijolos da torre -->
    <path d="M 32 105 L 108 105 M 36 135 L 104 135 M 28 165 L 112 165" stroke="#1e293b" stroke-width="1.8" opacity="0.6" />
    <path d="M 68 75 L 68 105 M 52 105 L 52 135 M 88 105 L 88 135 M 70 135 L 70 165" stroke="#1e293b" stroke-width="1.8" opacity="0.6" />

    <!-- Estandarte Azul Real da Torre -->
    <path d="M 42 90 L 98 90 L 98 160 L 70 178 L 42 160 Z" fill="url(#towerBlue)" stroke="url(#crGoldLight)" stroke-width="2" />
    
    <!-- Brasão Real no Estandarte -->
    <circle cx="70" cy="125" r="14" fill="#1e3a8a" stroke="url(#crGoldLight)" stroke-width="1.8" />
    <polygon points="62,129 65,121 70,125 75,121 78,129" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="0.8" />
    <circle cx="70" cy="123" r="1.8" fill="#ef4444" />

    <!-- Janela de Observação do Rei -->
    <path d="M 58 92 C 58 82, 82 82, 82 92 L 82 96 L 58 96 Z" fill="#090d16" stroke="#0f172a" stroke-width="1.5" />

    <!-- Plataforma e Ameias da Torre (Fortaleza) -->
    <polygon points="18,75 122,75 128,60 12,60" fill="#334155" stroke="#090d16" stroke-width="2.5" />
    <rect x="15" y="62" width="110" height="3" fill="url(#crGoldLight)" opacity="0.9" />

    <!-- Ameias de Pedra -->
    <rect x="15" y="42" width="20" height="20" rx="2" fill="url(#towerStone)" stroke="#090d16" stroke-width="2" />
    <rect x="44" y="42" width="22" height="20" rx="2" fill="url(#towerStone)" stroke="#090d16" stroke-width="2" />
    <rect x="74" y="42" width="22" height="20" rx="2" fill="url(#towerStone)" stroke="#090d16" stroke-width="2" />
    <rect x="105" y="42" width="20" height="20" rx="2" fill="url(#towerStone)" stroke="#090d16" stroke-width="2" />

    <!-- COROA DO CLASH NO TOPO DA TORRE -->
    <g transform="translate(35, 6) scale(0.5)">
      <!-- Veludo Vermelho -->
      <path d="M 28 85 C 25 55, 55 35, 80 35 C 105 35, 135 55, 132 85 Z" fill="url(#crVelvet)" stroke="#450A0A" stroke-width="2.5" />
      <!-- Corpo Dourado -->
      <path d="M 20 90 L 15 45 L 48 65 L 80 20 L 112 65 L 145 45 L 140 90 Z" fill="url(#crGoldDark)" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
      <path d="M 22 88 L 18 48 L 48 67 L 80 25 L 112 67 L 142 48 L 138 88 Z" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Orbe Superior com Rubi -->
      <circle cx="80" cy="22" r="10" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="2" />
      <circle cx="80" cy="22" r="6" fill="url(#crRuby)" stroke="#450A0A" stroke-width="1" />
      <!-- Orbes Laterais -->
      <circle cx="17" cy="46" r="7.5" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="2" />
      <circle cx="143" cy="46" r="7.5" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="2" />
      <!-- Faixa da Base com Rubis -->
      <path d="M 18 86 Q 80 96 142 86 L 144 105 Q 80 118 16 105 Z" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="2" />
      <ellipse cx="80" cy="102" rx="9" ry="7" fill="url(#crRuby)" stroke="#450A0A" stroke-width="1.5" />
    </g>
  </g>

  <!-- =================================================== -->
  <!-- TÍTULO PRINCIPAL E INFORMAÇÕES DA ARENA (MAIOR)    -->
  <!-- =================================================== -->
  <g transform="translate(185, 42)">
    <!-- Insígnia Estrela Nível 15 -->
    <g transform="translate(0, 8)">
      <polygon points="20,0 26,13 40,15 29,25 32,38 20,31 8,38 11,25 0,15 14,13" fill="url(#crGoldLight)" stroke="#78350F" stroke-width="2" />
      <text x="20" y="26" class="clash-font-md" font-size="14" font-weight="900" fill="#000" text-anchor="middle">15</text>
    </g>

    <!-- Nome do Jogador (Letra Grande e Impactante) -->
    <text x="52" y="38" class="clash-font-xl" font-size="44" font-weight="900" fill="url(#crGoldLight)" stroke="#3b1d06" stroke-width="1.8" letter-spacing="1.5">
      VINÍCIUS ROYALE
    </text>

    <!-- Estrela Cintilante -->
    <g transform="translate(540, 10)" class="sparkle-star">
      <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="#fff" opacity="0.9" />
    </g>

    <!-- Sub-banner com Detalhes da Torre e Bio -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="670" height="34" rx="17" fill="#0b1324" fill-opacity="0.9" stroke="url(#crGoldLight)" stroke-width="1.2" />
      <text x="335" y="23" class="clash-sub" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">
        👑 TORRE DO REI NÍVEL 15 • ⚔️ FULL STACK DEVELOPER • 🏆 9.000+ TROFÉUS
      </text>
    </g>

    <!-- Barra de Elixir e Status do Deck -->
    <g transform="translate(0, 106)">
      <!-- Gota de Elixir -->
      <path d="M 14 3 C 14 3, 3 16, 3 22 C 3 28, 8 33, 14 33 C 20 33, 25 28, 25 22 C 25 16, 14 3, 14 3 Z" fill="url(#elixirGrad)" stroke="#4a044e" stroke-width="1.5" />
      <circle cx="10" cy="20" r="3" fill="#fff" opacity="0.7" />
      
      <text x="34" y="24" class="clash-font-md" font-size="14" fill="#f472b6">DECK PRINCIPAL</text>
      <text x="175" y="24" class="mono-val" font-size="13" font-weight="bold" fill="#94a3b8">• CUSTO MÉDIO DE ELIXIR: 3.4 💧</text>
      <text x="470" y="24" class="clash-sub" font-size="12" font-weight="bold" fill="#eab308">★ LIGA MAIOR CAMPEÃO</text>
    </g>
  </g>

  <!-- =================================================== -->
  <!-- 5 CARTAS DE BATALHA GRANDES E REDIMENSIONADAS       -->
  <!-- =================================================== -->
  <!-- Largura: 152px cada, Espaçamento: 16px. Total 824px centralizado -->

  <!-- CARTA 1: TypeScript (Lendária) -->
  <g transform="translate(38, 218)" filter="url(#bigShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#1e293b" stroke="url(#legendaryGrad)" stroke-width="3" />
    <!-- Elixir drop -->
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">3</text>
    <!-- Card title -->
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">TypeScript</text>
    <!-- Card badge -->
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#fde047" text-anchor="middle">⭐ LENDÁRIA</text>
  </g>

  <!-- CARTA 2: React.js (Campeão) -->
  <g transform="translate(206, 218)" filter="url(#bigShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#1e293b" stroke="url(#championGrad)" stroke-width="3" />
    <!-- Elixir drop -->
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <!-- Card title -->
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#60a5fa" text-anchor="middle">React.js</text>
    <!-- Card badge -->
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">👑 CAMPEÃO</text>
  </g>

  <!-- CARTA 3: Node.js (Épica) -->
  <g transform="translate(374, 218)" filter="url(#bigShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#1e293b" stroke="url(#epicGrad)" stroke-width="3" />
    <!-- Elixir drop -->
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <!-- Card title -->
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#4ade80" text-anchor="middle">Node.js</text>
    <!-- Card badge -->
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">💜 ÉPICA</text>
  </g>

  <!-- CARTA 4: Python (Rara) -->
  <g transform="translate(542, 218)" filter="url(#bigShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#1e293b" stroke="url(#rareGrad)" stroke-width="3" />
    <!-- Elixir drop -->
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">4</text>
    <!-- Card title -->
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">Python</text>
    <!-- Card badge -->
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#fb923c" text-anchor="middle">🧡 RARA</text>
  </g>

  <!-- CARTA 5: Docker (Comum) -->
  <g transform="translate(710, 218)" filter="url(#bigShadow)">
    <rect x="0" y="0" width="152" height="114" rx="10" fill="#1e293b" stroke="url(#commonGrad)" stroke-width="3" />
    <!-- Elixir drop -->
    <circle cx="20" cy="20" r="12" fill="url(#elixirGrad)" stroke="#701a75" stroke-width="1.5" />
    <text x="20" y="25" class="clash-font-md" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">2</text>
    <!-- Card title -->
    <text x="76" y="58" class="clash-font-md" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">Docker</text>
    <!-- Card badge -->
    <rect x="18" y="76" width="116" height="24" rx="6" fill="#0b1324" stroke="#334155" stroke-width="1" />
    <text x="76" y="93" class="mono-val" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">⚪ COMUM</text>
  </g>
</svg>
