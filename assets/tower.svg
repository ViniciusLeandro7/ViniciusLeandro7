<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <!-- Stone Gradients -->
    <linearGradient id="stoneLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="stoneDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Royal Blue Banner -->
    <linearGradient id="royalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="towerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="towerVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <filter id="towerShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#towerShadow)">
    <!-- Tower Main Stone Base (Tapered) -->
    <polygon points="30,85 130,85 142,205 18,205" fill="url(#stoneLight)" stroke="#0f172a" stroke-width="3" />
    
    <!-- Stone Bricks Detail -->
    <path d="M 40 120 L 120 120 M 45 155 L 115 155 M 35 185 L 125 185" stroke="#1e293b" stroke-width="2" opacity="0.6" />
    <path d="M 75 85 L 75 120 M 60 120 L 60 155 M 95 120 L 95 155 M 80 155 L 80 185" stroke="#1e293b" stroke-width="2" opacity="0.6" />

    <!-- Royal Plinth / Tower Foundation -->
    <rect x="12" y="200" width="136" height="15" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
    <rect x="15" y="202" width="130" height="4" fill="url(#towerGold)" opacity="0.8" />

    <!-- Royal Blue Front Drapery / Tapestry -->
    <path d="M 50 100 L 110 100 L 110 175 L 80 195 L 50 175 Z" fill="url(#royalBlue)" stroke="url(#towerGold)" stroke-width="2.5" />
    
    <!-- Gold Trim / Crown Icon on Drapery -->
    <circle cx="80" cy="135" r="16" fill="#1e3a8a" stroke="url(#towerGold)" stroke-width="2" />
    <polygon points="70,140 73,130 80,135 87,130 90,140" fill="url(#towerGold)" stroke="#78350F" stroke-width="1" />
    <circle cx="80" cy="133" r="2" fill="#ef4444" />

    <!-- Tower Window / Arch -->
    <path d="M 68 102 C 68 90, 92 90, 92 102 L 92 108 L 68 108 Z" fill="#090d16" stroke="#0f172a" stroke-width="2" />

    <!-- Tower Battlements Platform / Cornice -->
    <polygon points="22,85 138,85 145,68 15,68" fill="url(#stoneDark)" stroke="#0f172a" stroke-width="3" />
    <rect x="18" y="70" width="124" height="4" fill="url(#towerGold)" opacity="0.9" />

    <!-- Crenellations (Fortress Teeth) -->
    <rect x="18" y="46" width="22" height="24" rx="2" fill="url(#stoneLight)" stroke="#0f172a" stroke-width="2.5" />
    <rect x="52" y="46" width="24" height="24" rx="2" fill="url(#stoneLight)" stroke="#0f172a" stroke-width="2.5" />
    <rect x="84" y="46" width="24" height="24" rx="2" fill="url(#stoneLight)" stroke="#0f172a" stroke-width="2.5" />
    <rect x="120" y="46" width="22" height="24" rx="2" fill="url(#stoneLight)" stroke="#0f172a" stroke-width="2.5" />

    <!-- ==================================== -->
    <!-- THE KING'S CROWN ON TOP OF THE TOWER -->
    <!-- ==================================== -->
    <g transform="translate(42, 6) scale(0.48)">
      <!-- Velvet Cushion -->
      <path d="M 28 85 C 25 55, 55 35, 80 35 C 105 35, 135 55, 132 85 Z" fill="url(#towerVelvet)" stroke="#450A0A" stroke-width="2.5" />
      <!-- Gold Body -->
      <path d="M 20 90 L 15 45 L 48 65 L 80 20 L 112 65 L 145 45 L 140 90 Z" fill="url(#towerGold)" stroke="#451A03" stroke-width="3" stroke-linejoin="round" />
      <!-- Center Orb with Ruby -->
      <circle cx="80" cy="22" r="10" fill="url(#towerGold)" stroke="#78350F" stroke-width="2" />
      <circle cx="80" cy="22" r="6" fill="#ef4444" stroke="#450A0A" stroke-width="1" />
      <circle cx="17" cy="46" r="7.5" fill="url(#towerGold)" stroke="#78350F" stroke-width="2" />
      <circle cx="143" cy="46" r="7.5" fill="url(#towerGold)" stroke="#78350F" stroke-width="2" />
      <!-- Base Band -->
      <path d="M 18 86 Q 80 96 142 86 L 144 105 Q 80 118 16 105 Z" fill="url(#towerGold)" stroke="#451A03" stroke-width="3" />
      <ellipse cx="80" cy="102" rx="9" ry="7" fill="#ef4444" stroke="#450A0A" stroke-width="1.8" />
      <ellipse cx="45" cy="98" rx="6" ry="5" fill="#38bdf8" stroke="#082F49" stroke-width="1.5" />
      <ellipse cx="115" cy="98" rx="6" ry="5" fill="#38bdf8" stroke="#082F49" stroke-width="1.5" />
    </g>
  </g>
</svg>
