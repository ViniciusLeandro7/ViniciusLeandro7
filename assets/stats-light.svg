<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Light -->
    <linearGradient id="stBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#edf2f7" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Royale Gold Gradients -->
    <linearGradient id="stGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="stGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Elixir Gradient -->
    <linearGradient id="stElixir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Trophy Gold -->
    <linearGradient id="stTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Drop Shadow Light -->
    <filter id="stShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <style>
      .clash-title {
        font-family: 'Supercell-Magic', 'Impact', 'Arial Black', -apple-system, sans-serif;
      }
      .clash-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .clash-val {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Outer Marble Container Frame -->
  <rect x="6" y="6" width="838" height="308" rx="20" fill="url(#stBgLight)" stroke="url(#stGoldDark)" stroke-width="4" filter="url(#stShadowLight)" />
  <rect x="14" y="14" width="822" height="292" rx="14" fill="none" stroke="url(#stGoldLight)" stroke-width="1.8" opacity="0.9" />

  <!-- Corner Rivets -->
  <circle cx="24" cy="24" r="5" fill="#f59e0b" stroke="#78350F" stroke-width="1" />
  <circle cx="826" cy="24" r="5" fill="#f59e0b" stroke="#78350F" stroke-width="1" />
  <circle cx="24" cy="296" r="5" fill="#f59e0b" stroke="#78350F" stroke-width="1" />
  <circle cx="826" cy="296" r="5" fill="#f59e0b" stroke="#78350F" stroke-width="1" />

  <!-- HEADER DO CARD -->
  <g transform="translate(40, 32)">
    <!-- Star Level 15 Badge -->
    <polygon points="20,0 26,13 40,15 29,25 32,38 20,31 8,38 11,25 0,15 14,13" fill="#f59e0b" stroke="#78350F" stroke-width="1.5" />
    <text x="20" y="25" class="clash-title" font-size="14" font-weight="900" fill="#000" text-anchor="middle">15</text>
    
    <!-- Title and Arena Info -->
    <text x="55" y="20" class="clash-title" font-size="20" font-weight="900" fill="#92400e">ESTATÍSTICAS DA ARENA ROYALE</text>
    <text x="55" y="38" class="clash-body" font-size="13" font-weight="600" fill="#475569">Temporada Atual • Liga: Maior Campeão (Ultimate Champion)</text>
  </g>

  <!-- 4 STAT BOXES (FUNDO BRANCO ELEVADO - ALTO CONTRASTE) -->
  <!-- BOX 1: TROFÉUS (9000+) -->
  <g transform="translate(40, 90)" filter="url(#stShadowLight)">
    <rect x="0" y="0" width="180" height="95" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <path d="M 22 18 L 38 18 L 38 30 C 38 35, 34 38, 30 38 C 26 38, 22 35, 22 30 Z" fill="url(#stTrophy)" stroke="#78350F" stroke-width="1.5" />
    <path d="M 18 20 L 22 20 L 22 26 L 18 26 Z M 38 20 L 42 20 L 42 26 L 38 26 Z" fill="url(#stTrophy)" />
    <rect x="28" y="38" width="4" height="6" fill="url(#stTrophy)" />
    <rect x="24" y="44" width="12" height="4" fill="url(#stTrophy)" />
    <text x="50" y="32" class="clash-body" font-size="11" font-weight="bold" fill="#b45309">TROFÉUS</text>
    <text x="90" y="66" class="clash-title" font-size="26" font-weight="900" fill="#0f172a" text-anchor="middle">9.000</text>
    <text x="90" y="83" class="clash-val" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">MAX TROPHY: 9000</text>
  </g>

  <!-- BOX 2: VITÓRIAS DE 3 COROAS -->
  <g transform="translate(235, 90)" filter="url(#stShadowLight)">
    <rect x="0" y="0" width="180" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="30" y="33" font-size="16">👑</text>
    <text x="52" y="32" class="clash-body" font-size="11" font-weight="bold" fill="#b91c1c">3 COROAS</text>
    <text x="90" y="66" class="clash-title" font-size="26" font-weight="900" fill="#0f172a" text-anchor="middle">1.450+</text>
    <text x="90" y="83" class="clash-val" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">VITÓRIAS REAIS</text>
  </g>

  <!-- BOX 3: TAXA DE VITÓRIA (WIN RATE) -->
  <g transform="translate(430, 90)" filter="url(#stShadowLight)">
    <rect x="0" y="0" width="180" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <text x="30" y="33" font-size="16">⚔️</text>
    <text x="52" y="32" class="clash-body" font-size="11" font-weight="bold" fill="#15803d">WIN RATE</text>
    <text x="90" y="66" class="clash-title" font-size="26" font-weight="900" fill="#15803d" text-anchor="middle">82.4%</text>
    <text x="90" y="83" class="clash-val" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">COMMITS PRECISOS</text>
  </g>

  <!-- BOX 4: PRODUÇÃO DE ELIXIR -->
  <g transform="translate(625, 90)" filter="url(#stShadowLight)">
    <rect x="0" y="0" width="185" height="95" rx="12" fill="#ffffff" stroke="#c026d3" stroke-width="2" />
    <text x="28" y="33" font-size="16">💧</text>
    <text x="50" y="32" class="clash-body" font-size="11" font-weight="bold" fill="#a21caf">PRODUÇÃO</text>
    <text x="92" y="66" class="clash-title" font-size="24" font-weight="900" fill="#c026d3" text-anchor="middle">100% ELIXIR</text>
    <text x="92" y="83" class="clash-val" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">FULL TIME CODER</text>
  </g>

  <!-- BARRA INFERIOR: CLÃ E BADGES -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="770" height="85" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Clan Badge -->
    <g transform="translate(25, 18)">
      <polygon points="15,0 30,8 30,35 15,45 0,35 0,8" fill="#1e3a8a" stroke="#d97706" stroke-width="2" />
      <polygon points="15,10 23,26 7,26" fill="#f59e0b" />
      <text x="45" y="22" class="clash-title" font-size="15" fill="#92400e">CLÃ: CODE ROYALE</text>
      <text x="45" y="38" class="clash-body" font-size="12" fill="#475569">Jogador: ViniciusLeandro7 • Cargo: Líder • Tag: #ViniciusLeandro7</text>
    </g>

    <!-- Right Side Badges -->
    <g transform="translate(510, 22)">
      <rect x="0" y="0" width="115" height="42" rx="8" fill="#f8fafc" stroke="#d97706" stroke-width="1.2" />
      <text x="57" y="18" class="clash-body" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">BAÚS ABERTOS</text>
      <text x="57" y="34" class="clash-val" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">500+ REPOS</text>
    </g>

    <g transform="translate(640, 22)">
      <rect x="0" y="0" width="110" height="42" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" />
      <text x="55" y="18" class="clash-body" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">DESAFIOS</text>
      <text x="55" y="34" class="clash-val" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">12 VITÓRIAS</text>
    </g>
  </g>
</svg>
